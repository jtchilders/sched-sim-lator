# Demonstrates the OLD 512-node running-pool cap as ONE testable strategy.
# With the empirical workload this is oversubscribed -> the saturation guard
# should fire quickly with a clear message instead of hanging forever.
trace_db: /Users/jchilders/pbs_monitor_aurora.db
machine: {total_nodes: 10624}
programs:
  - {name: INCITE, target_share: 0.50, overburn: 0.25, alloc_year_start_month: 1}
  - {name: ALCC,   target_share: 0.25, overburn: 0.0,  alloc_year_start_month: 7}
  - {name: DD,     target_share: 0.10, overburn: 0.0,  soft_floor: true, alloc_year_start_month: 1}
genesis: {enabled: false}
capacity_protection:
  strategy: running_pool_cap
  pool_nodes: 512
  protected_tier: capacity
scheduler:
  policy: blind
  score_expr: "base + aging_rate * wait"
run: {duration_days: 30, start_month: 1, sample_dt_h: 6.0, n_seeds: 1, base_seed: 42}
output:
  outdir: results/pool_cap_512
  saturation_abort_pending: 20000
